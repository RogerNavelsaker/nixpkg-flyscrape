name: Update upstream release

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new release and update flake.nix
        id: update
        run: |
          # Fetch the latest release tag from the upstream repo
          LATEST_TAG=$(curl -s https://api.github.com/repos/philippta/flyscrape/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            echo "Failed to fetch latest tag"
            exit 1
          fi
          
          VERSION=${LATEST_TAG#v}
          CURRENT_VERSION=$(grep 'version = "' flake.nix | head -n1 | awk -F'"' '{print $2}')
          
          echo "Current version: $CURRENT_VERSION"
          echo "Latest version: $VERSION"
          
          if [ "$VERSION" == "$CURRENT_VERSION" ]; then
            echo "Already up to date."
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "New version found! Updating..."
          
          # Fetch checksums
          curl -sL "https://github.com/philippta/flyscrape/releases/download/${LATEST_TAG}/flyscrape_${VERSION}_checksums.txt" -o checksums.txt
          
          # We need SHA-256 for nix which the checksums.txt natively provides
          HASH_LINUX_AMD64=$(grep "linux_amd64.tar.gz" checksums.txt | awk '{print $1}')
          HASH_LINUX_ARM64=$(grep "linux_arm64.tar.gz" checksums.txt | awk '{print $1}')
          HASH_DARWIN_AMD64=$(grep "darwin_amd64.tar.gz" checksums.txt | awk '{print $1}')
          HASH_DARWIN_ARM64=$(grep "darwin_arm64.tar.gz" checksums.txt | awk '{print $1}')
          
          # Use sed to update flake.nix
          sed -i "s/version = \".*\"/version = \"$VERSION\"/" flake.nix
          sed -i "s/\"x86_64-linux\" = \".*\"/\"x86_64-linux\" = \"$HASH_LINUX_AMD64\"/" flake.nix
          sed -i "s/\"aarch64-linux\" = \".*\"/\"aarch64-linux\" = \"$HASH_LINUX_ARM64\"/" flake.nix
          sed -i "s/\"x86_64-darwin\" = \".*\"/\"x86_64-darwin\" = \"$HASH_DARWIN_AMD64\"/" flake.nix
          sed -i "s/\"aarch64-darwin\" = \".*\"/\"aarch64-darwin\" = \"$HASH_DARWIN_ARM64\"/" flake.nix
          
          rm checksums.txt
          
          echo "updated=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Nix
        if: steps.update.outputs.updated == 'true'
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify build
        if: steps.update.outputs.updated == 'true'
        run: nix build .#default

      - name: Commit and push changes
        if: steps.update.outputs.updated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update flyscrape to v${{ steps.update.outputs.version }}"
          branch: main
